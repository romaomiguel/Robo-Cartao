<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de configuração</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif; background: #0b1120; color: #e2e8f0;
    }
    .login-card {
      width: 100%; max-width: 360px; background: #161f32; border: 1px solid #24304a;
      border-radius: 14px; padding: 36px 32px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .login-card h1 { font-size: 19px; margin: 0 0 4px; }
    .login-card p.sub { margin: 0 0 24px; color: #8896b3; font-size: 13px; }
    label { display: block; font-size: 12px; color: #93a2c0; margin-bottom: 6px; }
    input[type=password] {
      width: 100%; background: #0b1120; color: #e2e8f0; border: 1px solid #2c3958;
      border-radius: 8px; padding: 11px 12px; font-size: 14px; outline: none;
    }
    input[type=password]:focus { border-color: #3b82f6; }
    button {
      width: 100%; margin-top: 18px; background: #2563eb; color: #fff; border: none;
      padding: 11px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .erro { margin-top: 14px; color: #f87171; font-size: 13px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Painel de configuração</h1>
    <p class="sub">Robô Cartão &middot; acesso restrito</p>
    <form method="post">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Entrar</button>
      {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    </form>
  </div>
</body>
</html>
